<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMI - Dios</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:'Manrope',sans-serif;
background:#0f0a1e;
color:#fff;
}
.login-box{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.login-card{
background:#1e1042;
border:1px solid #3a0f6e;
border-radius:24px;
padding:28px;
width:100%;
max-width:360px;
}
.login-card h1{
font-weight:800;
font-size:24px;
color:#fff;
}
.login-card h1 span{
color:#a855f7;
}
.login-card input{
width:100%;
padding:14px 16px;
border-radius:999px;
border:1px solid #3a0f6e;
background:#12082e;
color:#fff;
outline:none;
margin-top:12px;
}
.login-card button{
width:100%;
padding:14px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,#6a11cb,#7b1fa2);
color:#fff;
font-weight:800;
margin-top:16px;
}
.header{
position:sticky;
top:0;
z-index:10;
background:rgba(15,10,30,.9);
backdrop-filter:blur(10px);
border-bottom:1px solid #3a0f6e;
padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-weight:800;
font-size:20px;
color:#fff;
}
.logo span{
color:#a855f7;
}
.tabs{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 14px;
scrollbar-width:none;
}
.tabs::-webkit-scrollbar{
display:none;
}
.tab{
white-space:nowrap;
padding:8px 16px;
border-radius:999px;
border:1px solid #3a0f6e;
background:#1e1042;
color:#a855f7;
font-weight:700;
font-size:13px;
}
.tab.active{
background:linear-gradient(135deg,#6a11cb,#7b1fa2);
color:#fff;
border-color:#6a11cb;
}
<style>
.panel{
padding:14px;
}
.card{
background:#1e1042;
border:1px solid #3a0f6e;
border-radius:18px;
padding:14px;
margin-bottom:12px;
}
.card-title{
font-weight:700;
font-size:14px;
color:#fff;
}
.card-sub{
font-size:12px;
color:#a855f7;
margin-top:4px;
}
.badge{
display:inline-block;
padding:4px 10px;
border-radius:999px;
font-size:11px;
font-weight:800;
margin-top:8px;
}
.badge-cliente{
background:rgba(168,85,247,.2);
color:#a855f7;
border:1px solid #a855f7;
}
.badge-local{
background:rgba(106,17,203,.3);
color:#c4b5fd;
border:1px solid #6a11cb;
}
.grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}
.img-thumb{
width:100%;
border-radius:12px;
margin-top:10px;
max-height:180px;
object-fit:cover;
}
.btn-row{
display:flex;
gap:8px;
margin-top:12px;
}
.btn{
flex:1;
padding:10px;
border-radius:999px;
border:none;
font-weight:700;
font-size:12px;
}
.btn-del{
background:rgba(239,68,68,.15);
color:#f87171;
border:1px solid #ef4444;
}
.btn-ok{
background:linear-gradient(135deg,#6a11cb,#7b1fa2);
color:#fff;
}
.empty{
padding:40px 20px;
text-align:center;
color:#a855f7;
}
</style>
</head>
<body>
<div id="login" class="login-box">
<div class="login-card">
<h1>
ADMI <span>DIOS</span>
</h1>
<input id="email" type="email" placeholder="jjrv.0093@gmail.com">
<input id="pass" type="password" placeholder="Password">
<button onclick="doLogin()">
Entrar
</button>
<div id="loginMsg" style="margin-top:12px;font-size:12px;color:#f87171"></div>
</div>
</div>
<div id="app" style="display:none">
<div class="header">
<div class="logo">
MAS <span>VENTAS</span> ADMI
</div>
<button onclick="doLogout()" style="border:none;background:#1e1042;color:#a855f7;padding:8px 14px;border-radius:999px;border:1px solid #3a0f6e;font-weight:700">
Salir
</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>
</div>
<script>
const OWNER_EMAIL='jjrv.0093@gmail.com';
const ADMIN_KEY='admin_catalog_v2';
const RESERVAS_KEY='reservas_para_admi';
const SOPORTE_KEY='soporte_admi_v6';
let currentTab='soporte';
function doLogin(){
let e=document.getElementById('email').value.trim();
let p=document.getElementById('pass').value.trim();
let msg=document.getElementById('loginMsg');
if(e.toLowerCase()!==OWNER_EMAIL){
msg.textContent='Solo OWNER puede entrar';
return;
}
if(!p){
msg.textContent='Falta password';
return;
}
localStorage.setItem('admi_auth','true');
showApp();
}
function doLogout(){
localStorage.removeItem('admi_auth');
document.getElementById('login').style.display='flex';
document.getElementById('app').style.display='none';
}
function showApp(){
if(localStorage.getItem('admi_auth')!=='true') return;
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
renderTabs();
render();
}
function getTabsList(){
return [
'soporte',
'reservas',
'catalogo',
'clientes',
'pagos'
];
}
function renderTabs(){
let box=document.getElementById('tabs');
let html='';
getTabsList().forEach(t=>{
html+=`<button class="tab ${t===currentTab?'active':''}" onclick="setTab('${t}')">${t.toUpperCase()}</button>`;
});
box.innerHTML=html;
}
function setTab(t){
currentTab=t;
renderTabs();
render();
}
function getSoporte(){
try{
let a=JSON.parse(localStorage.getItem(SOPORTE_KEY)||'[]');
let b=JSON.parse(localStorage.getItem(RESERVAS_KEY)||'[]');
return [...a,...b].sort((x,y)=>new Date(y.fecha||y.fechaHoraProblema)-new Date(x.fecha||x.fechaHoraProblema));
}catch(e){
return [];
}
}
function getReservas(){
try{
return JSON.parse(localStorage.getItem(RESERVAS_KEY)||'[]');
}catch(e){
return [];
}
}
function getCatalogo(){
try{
return JSON.parse(localStorage.getItem(ADMIN_KEY)||'[]');
}catch(e){
return [];
}
}
<script>
function render(){
let panel=document.getElementById('panel');
if(currentTab==='soporte'){
let data=getSoporte();
if(data.length===0){
panel.innerHTML=`<div class="empty">Si no hizo reserva no figura nada, si hizo le figura</div>`;
return;
}
let html='<div class="grid">';
data.forEach((r,i)=>{
let origen=r.origen||r.clienteData?.origen||'desconocido';
let badgeClass=origen.includes('cliente')?'badge-cliente':'badge-local';
let nombre=r.producto?.nombre||r.datosReservaCompleto?.producto?.nombre||r.mensaje||'Sin mensaje';
let idReserva=r.idReserva||r.datosReservaCompleto?.idReserva||'sin-id';
let uid=r.uidLocal||r.datosReservaCompleto?.uidLocal||r.clienteData?.uid||'sin-uid';
let img=r.imagen||r.producto?.imagen||r.datosReservaCompleto?.producto?.imagen||'';
let fecha=r.fecha||r.fechaHoraProblema||r.datosReservaCompleto?.fecha||'';
html+=`
<div class="card">
<div class="card-title">${nombre}</div>
<div class="card-sub">ID Reserva: ${idReserva}</div>
<div class="card-sub">UID Local: ${uid}</div>
<div class="card-sub">Fecha: ${fecha}</div>
<div class="badge ${badgeClass}">${origen.toUpperCase()}</div>
${img?`<img class="img-thumb" src="${img}">`:''}
<div class="btn-row">
<button class="btn btn-del" onclick="delSoporte(${i})">Borrar</button>
<button class="btn btn-ok" onclick="verDatos(${i})">Ver datosReservaCompleto</button>
</div>
</div>
`;
});
html+='</div>';
panel.innerHTML=html;
return;
}
if(currentTab==='reservas'){
let data=getReservas();
if(data.length===0){
panel.innerHTML=`<div class="empty">No hay reservas</div>`;
return;
}
let html='<div class="grid">';
data.forEach((r,i)=>{
html+=`
<div class="card">
<div class="card-title">${r.producto?.nombre||'Reserva'}</div>
<div class="card-sub">${r.producto?.precio?'$'+r.producto.precio:''}</div>
<div class="card-sub">${r.idReserva||''}</div>
<div class="card-sub">${r.uidLocal||''}</div>
<div class="badge badge-cliente">${(r.clienteData?.origen||'cliente').toUpperCase()}</div>
<div class="btn-row">
<button class="btn btn-del" onclick="delReserva(${i})">Borrar</button>
</div>
</div>
`;
});
html+='</div>';
panel.innerHTML=html;
return;
}
if(currentTab==='catalogo'){
let data=getCatalogo();
if(data.length===0){
panel.innerHTML=`<div class="empty">Catálogo vacío</div>`;
return;
}
let html='<div class="grid">';
data.forEach((p,i)=>{
html+=`
<div class="card">
<div class="card-title">${p.nombre}</div>
<div class="card-sub">$${p.precio} - ${p.categoria}</div>
<img class="img-thumb" src="${p.imagen}">
<div class="btn-row">
<button class="btn btn-del" onclick="delProd(${i})">Borrar</button>
</div>
</div>
`;
});
html+='</div>';
panel.innerHTML=html;
return;
}
panel.innerHTML=`<div class="empty">Panel ${currentTab} - Si no hizo reserva no figura nada</div>`;
}
function delSoporte(i){
let a=JSON.parse(localStorage.getItem(SOPORTE_KEY)||'[]');
let b=JSON.parse(localStorage.getItem(RESERVAS_KEY)||'[]');
let all=[...a,...b];
all.splice(i,1);
let newA=all.filter(x=>!x.idReserva||!x.producto);
let newB=all.filter(x=>x.idReserva&&x.producto);
localStorage.setItem(SOPORTE_KEY,JSON.stringify(newA));
localStorage.setItem(RESERVAS_KEY,JSON.stringify(newB));
render();
}
function delReserva(i){
let b=JSON.parse(localStorage.getItem(RESERVAS_KEY)||'[]');
b.splice(i,1);
localStorage.setItem(RESERVAS_KEY,JSON.stringify(b));
render();
}
function delProd(i){
let c=getCatalogo();
c.splice(i,1);
localStorage.setItem(ADMIN_KEY,JSON.stringify(c));
render();
}
function verDatos(i){
let data=getSoporte();
let r=data[i];
alert(JSON.stringify(r.datosReservaCompleto||r,null,2));
}
showApp();
</script>
</body>
</html>
