<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reservAR ADMI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header-reservar"><h1>reservAR <span>ADMI - tu lugar, tu momento.</span></h1></div>

<div id="loginBox" class="auth">
<h2>Ingresá ADMI</h2>
<input id="email" placeholder="Email admi" type="email">
<input id="pass" placeholder="Contraseña" type="password">
<button id="loginBtn" class="btn full">Entrar</button>
<small id="loginNote" class="note"></small>
</div>

<div id="panelBox" class="wrap hidden">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <div class="tabs">
      <button class="tab active" data-tab="planes">Planes</button>
      <button class="tab" data-tab="soporte">Soporte</button>
      <button class="tab" data-tab="usuarios">Usuarios</button>
    </div>
    <button id="logoutBtn" class="btn small">Salir</button>
  </div>

  <div class="card row">
    <label>Horas plan por defecto: <input id="horasPlan" type="number" value="48" style="width:80px"></label>
    <button id="guardarHoras" class="btn small">Guardar horas</button>
  </div>

  <div id="grid" class="grid">Cargando...</div>
</div>

<div id="toast" class="hidden" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 16px; border-radius:10px; z-index:99;"></div>

<script type="module" src="app.js"></script>
</body>
</html>
