<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reservAR ADMI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#7c3aed 0%,#5b21b6 40%,#1e0e45 100%);color:#fff}
header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}
.tabs{display:flex;gap:8px;padding:0 20px 12px}
.tab{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.15);cursor:pointer;font-size:14px}
.tab.active{background:#a78bfa;color:#fff}
.wrap{padding:16px;max-width:900px;margin:0 auto}
.card{background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.18);border-radius:18px;padding:20px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);margin:6px 0;font-size:16px;outline:none}
#email{background:#eef2ff;color:#111}
#pass{background:rgba(0,0,0,0.18);color:#fff}
.btn{padding:12px 16px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
.btn-primary{width:100%;background:#a78bfa;color:#fff;margin-top:8px}
.btn.small{width:auto;padding:8px 14px;font-size:13px}
.ok{background:#22c55e;color:#fff} .warn{background:#ef4444;color:#fff}
.hidden{display:none!important}
#loginBox{max-width:400px;margin:40px auto}
#loginNote{color:#ffb4b4;font-size:13px;margin-top:10px;min-height:18px;word-break:break-word}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
#grid .card{background:rgba(0,0,0,0.25)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-weight:700;z-index:99}
</style>
</head>
<body>

<header>
<div><b>reservAR</b> ADMI - tu lugar, tu momento.</div>
<button id="logoutBtn" class="btn small warn hidden">Salir</button>
</header>

<div id="loginBox" class="wrap">
<div class="card">
<h2 style="margin:0 0 16px 0;font-size:28px">Ingresá ADMI</h2>
<input id="email" type="email" value="jjrv.0093@gmail.com">
<input id="pass" type="password" placeholder="••••••••">
<button id="loginBtn" class="btn btn-primary">Entrar</button>
<div id="loginNote"></div>
</div>
</div>

<div id="panelBox" class="hidden">
<div class="tabs">
<div class="tab active" data-tab="planes">Planes</div>
<div class="tab" data-tab="soporte">Soporte</div>
<div class="tab" data-tab="usuarios">Usuarios</div>
</div>
<div class="wrap">
<div class="card" style="display:flex;gap:8px;align-items:center">
<input id="horasPlan" type="number" value="48" style="flex:1;background:#fff;color:#000;margin:0">
<button id="guardarHoras" class="btn small ok">Guardar horas</button>
</div>
<div id="grid"></div>
</div>
</div>

<div id="toast" class="hidden"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
