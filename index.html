<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reservAR ADM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--stroke:#ffffff20;--stroke2:#ffffff26;--card:#ffffff12;--card2:#1e1042;--borde:#3a0f6e;--bg1:#0f0a1e;--acc:#a855f7;--acc2:#6a11cb}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font-family:Inter,system-ui;color:#fff;background:linear-gradient(160deg,#6a11cb,#7b1fa2 40%,#3a0f6e 70%,#0a0933);background-attachment:fixed;min-height:100vh}
.hidden{display:none!important}
.login-box{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#1e1042;border:1px solid #3a0f6e;border-radius:24px;padding:28px;width:100%;max-width:360px}
.login-card h1{font-family:Manrope;font-weight:800;font-size:24px}.login-card h1 span{color:#a855f7}
.login-card input{width:100%;padding:14px 16px;border-radius:999px;border:1px solid #3a0f6e;background:#12082e;color:#fff;outline:none;margin-top:12px}
.login-card button{width:100%;padding:14px;border-radius:999px;border:none;background:linear-gradient(135deg,#6a11cb,#7b1fa2);color:#fff;font-weight:800;margin-top:16px;cursor:pointer}
.header{position:sticky;top:0;z-index:10;background:rgba(15,10,30,.92);backdrop-filter:blur(10px);border-bottom:1px solid #3a0f6e;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Manrope;font-weight:800;font-size:18px}.logo span{color:#a855f7}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #3a0f6e;background:#1e1042;color:#a855f7;font-weight:700;font-size:12px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#6a11cb,#7b1fa2);color:#fff;border-color:#6a11cb}
.panel{padding:14px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--stroke2);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.card-title{font-weight:800;font-size:14px}.card-sub{font-size:12px;color:#cfc9e6;margin-top:4px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-top:8px}
.badge-cliente{background:rgba(168,85,247,.2);color:#a855f7;border:1px solid #a855f7}
.badge-local{background:rgba(106,17,203,.3);color:#c4b5fd;border:1px solid #6a11cb}
.badge-promo{background:#facc15;color:#000;border:1px solid #facc15}
.badge-ok{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid #22c55e}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.img-thumb{width:100%;border-radius:12px;margin-top:10px;max-height:180px;object-fit:cover}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;padding:10px;border-radius:999px;border:none;font-weight:700;font-size:12px;cursor:pointer;min-width:90px}
.btn-del{background:rgba(239,68,68,.15);color:#f87171;border:1px solid #ef4444}
.btn-ok{background:linear-gradient(135deg,#6a11cb,#7b1fa2);color:#fff}
.btn-ghost{background:#1e1042;color:#a855f7;border:1px solid #3a0f6e}
.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #3a0f6e;background:#12082e;color:#fff;margin-top:8px}
.empty{padding:40px 20px;text-align:center;color:#a855f7}
.aviso{padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:10px}
.aviso-green{background:rgba(34,197,94,.15);border:1px solid #22c55e;color:#86efac}
.aviso-yellow{background:#facc15;color:#000;border:1px solid #facc15}
.aviso-red{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#f87171}
</style>
</head>
<body>
<div id="login" class="login-box">
<div class="login-card">
<h1>ADMI <span>DIOS</span></h1>
<input id="email" type="email" placeholder="jjrv.0093@gmail.com">
<input id="pass" type="password" placeholder="Password">
<button onclick="doLogin()">Entrar</button>
<div id="loginMsg" style="margin-top:12px;font-size:12px;color:#f87171"></div>
</div>
</div>
<div id="app" style="display:none">
<div class="header">
<div class="logo">MAS <span>VENTAS</span> ADMI</div>
<button onclick="doLogout()" style="border:none;background:#1e1042;color:#a855f7;padding:8px 14px;border-radius:999px;border:1px solid #3a0f6e;font-weight:700">Salir</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const OWNER_EMAIL='jjrv.0093@gmail.com';
const fb={
apiKey:"TU_APIKEY_REAL",
authDomain:"reservar-3a4d8.firebaseapp.com",
projectId:"reservar-3a4d8",
storageBucket:"reservar-3a4d8.appspot.com",
messagingSenderId:"TU_SENDER",
appId:"TU_APPID"
};
firebase.initializeApp(fb);
const auth=firebase.auth();
const db=firebase.firestore();
let currentTab='soporte';
let cacheSoporte=[],cacheReservas=[],cacheLocales=[],cacheMensajes=null,cachePlanes=null;
function doLogin(){
let e=document.getElementById('email').value.trim().toLowerCase();
let p=document.getElementById('pass').value.trim();
let msg=document.getElementById('loginMsg');
if(e!==OWNER_EMAIL){msg.textContent='Solo OWNER';return}
if(!p){msg.textContent='Falta pass';return}
auth.signInWithEmailAndPassword(e,p).then(()=>{showApp()}).catch(err=>{msg.textContent=err.message});
}
function doLogout(){auth.signOut().then(()=>{localStorage.removeItem('admi_auth');document.getElementById('login').style.display='flex';document.getElementById('app').style.display='none'})}
function showApp(){
auth.onAuthStateChanged(u=>{
if(!u||u.email.toLowerCase()!==OWNER_EMAIL){document.getElementById('login').style.display='flex';document.getElementById('app').style.display='none';return}
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
renderTabs();loadAll();
});
}
function getTabsList(){return ['soporte','reservas','locales','clientes','pagos','planes','mensajes'];}
function renderTabs(){
let box=document.getElementById('tabs');let html='';
getTabsList().forEach(t=>{html+=`<button class="tab ${t===currentTab?'active':''}" onclick="setTab('${t}')">${t.toUpperCase()}</button>`});
box.innerHTML=html;
}
function setTab(t){currentTab=t;renderTabs();render();}
function fmtTs(ts){try{if(!ts)return'';let d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('es-AR')}catch(e){return String(ts)}}
function diasRestantes(trialFin){try{let fin=trialFin?.toDate?trialFin.toDate():new Date(trialFin);let diff=fin-Date.now();return Math.ceil(diff/86400000)}catch(e){return 0}}
function horasGracia(trialFin){try{let fin=trialFin?.toDate?trialFin.toDate():new Date(trialFin);let limite=new Date(fin.getTime()+48*3600000);let diff=limite-Date.now();if(diff<=0)return '0hs';let h=Math.floor(diff/3600000);let m=Math.floor((diff%3600000)/60000);return `${h}hs ${m}min`}catch(e){return ''}}
</script>
<script>
async function loadAll(){
try{
let sopSnap=await db.collection('soporte').orderBy('ts','desc').limit(200).get();
cacheSoporte=sopSnap.docs.map(d=>({id:d.id,...d.data()}));
}catch(e){cacheSoporte=[]}
try{
let resSnap=await db.collection('reservas').orderBy('ts','desc').limit(200).get();
cacheReservas=resSnap.docs.map(d=>({id:d.id,...d.data()}));
}catch(e){cacheReservas=[]}
try{
let locSnap=await db.collection('config').limit(200).get();
cacheLocales=locSnap.docs.map(d=>({id:d.id,...d.data()}));
}catch(e){cacheLocales=[]}
try{
let mensSnap=await db.collection('config').doc('mensajes').get();
cacheMensajes=mensSnap.exists?mensSnap.data():null;
}catch(e){cacheMensajes=null}
try{
let planesSnap=await db.collection('config').doc('planes').get();
cachePlanes=planesSnap.exists?planesSnap.data():null;
}catch(e){cachePlanes=null}
render();
}
function render(){
let panel=document.getElementById('panel');
if(currentTab==='soporte'){renderSoporte(panel);return}
if(currentTab==='reservas'){renderReservas(panel);return}
if(currentTab==='locales'){renderLocales(panel);return}
if(currentTab==='clientes'){renderClientes(panel);return}
if(currentTab==='pagos'){renderPagos(panel);return}
if(currentTab==='planes'){renderPlanes(panel);return}
if(currentTab==='mensajes'){renderMensajes(panel);return}
}
function renderSoporte(panel){
if(cacheSoporte.length===0){panel.innerHTML=`<div class="empty">Sin soporte - si no hizo reserva no figura nada</div>`;return}
let html='<div class="grid">';
cacheSoporte.forEach((r,i)=>{
let origen=(r.origen||r.clienteData?.origen||'desconocido');
let badgeClass=origen.includes('cliente')?'badge-cliente':'badge-local';
let nombre=r.mensaje||r.producto?.nombre||r.datosReservaCompleto?.producto?.nombre||'Soporte';
let idReserva=r.idReserva||r.datosReservaCompleto?.idReserva||r.id||'sin-id';
let uid=r.uidLocal||r.datosReservaCompleto?.uidLocal||r.clienteData?.uid||r.uid||'sin-uid';
let img=r.imagen||r.producto?.imagen||r.datosReservaCompleto?.producto?.imagen||r.foto||'';
let fecha=r.ts?fmtTs(r.ts):(r.fecha||r.fechaHoraProblema||'');
let mail=r.email||r.clienteData?.email||r.datosReservaCompleto?.clienteData?.email||'';
let wa=r.whatsapp||r.clienteData?.whatsapp||'';
html+=`<div class="card"><div class="card-title">${nombre}</div><div class="card-sub">ID: ${idReserva}</div><div class="card-sub">UID: ${uid}</div><div class="card-sub">${fecha}</div><div class="card-sub">${mail} ${wa}</div><div class="badge ${badgeClass}">${origen.toUpperCase()}</div>${img?`<img class="img-thumb" src="${img}">`:''}<div class="btn-row"><button class="btn btn-del" onclick="delSoporteReal('${r.id}')">Borrar</button><button class="btn btn-ok" onclick="verDatosReal(${i})">Ver completo</button></div></div>`;
});
html+='<
/div>';panel.innerHTML=html;
}
function renderReservas(panel){
if(cacheReservas.length===0){panel.innerHTML=`<div class="empty">No hay reservas</div>`;return}
let html='<div class="grid">';
cacheReservas.forEach(r=>{
let origen=(r.origen||r.clienteData?.origen||'cliente');
let badge=origen.includes('cliente')?'badge-cliente':'badge-local';
html+=`<div class="card"><div class="card-title">${r.producto?.nombre||r.servicio||'Reserva'}</div><div class="card-sub">$${r.producto?.precio||r.precio||''} ${r.fecha||''} ${r.hora||''}</div><div class="card-sub">${r.idReserva||r.id}</div><div class="card-sub">${r.uidLocal||r.localId||''}</div><div class="badge ${badge}">${origen.toUpperCase()}</div><div class="btn-row"><button class="btn btn-del" onclick="delReservaReal('${r.id}')">Borrar</button></div></div>`;
});
html+='</div>';panel.innerHTML=html;
}
</script>
<script>
function renderLocales(panel){
if(cacheLocales.length===0){panel.innerHTML=`<div class="empty">Sin locales en config</div>`;return}
let html='<div class="grid">';
cacheLocales.forEach(l=>{
if(l.id==='mensajes'||l.id==='planes'||l.id==='promo'||l.id==='cobros'||l.id==='precios')return;
let plan=l.plan||'casa';
let usos=l.usosMes||0;
let precioPor=l.precioPorReserva||100;
let aCobrar=plan==='casa'?usos*precioPor:0;
let trialFin=l.trialFin;
let dRest=trialFin?diasRestantes(trialFin):'-';
let gracia=trialFin?horasGracia(trialFin):'';
let bloqueado=l.bloqueado?'BLOQUEADO':'ACTIVO';
let claseBloq=l.bloqueado?'aviso-red':'aviso-green';
html+=`<div class="card"><div class="card-title">${l.localNombre||l.nombre||l.id} • ${plan.toUpperCase()}</div><div class="card-sub">Email: ${l.email||''}</div><div class="card-sub">Plan: ${plan} | UsosMes: ${usos} | PrecioPor: $${precioPor}</div><div class="card-sub">A cobrar casa: $${aCobrar}</div><div class="card-sub">Trial dias restantes: ${dRest} | Gracia: ${gracia}</div><div class="aviso ${claseBloq}">${bloqueado} - Visible: ${l.visible!==false?'SI':'NO'} - PlanActivo: ${l.planActivo!==false?'SI':'NO'}</div><div class="btn-row"><button class="btn btn-ok" onclick="extender30('${l.id}')">+30 días</button><button class="btn btn-ok" onclick="extender7('${l.id}')">+7 días gratis</button><button class="btn btn-ghost" onclick="toggleBloqueo('${l.id}',${!!l.bloqueado})">${l.bloqueado?'Desbloquear':'Bloquear'}</button><button class="btn btn-ghost" onclick="resetUsos('${l.id}')">Reset usos casa</button></div></div>`;
});
html+='</div>';panel.innerHTML=html;
}
async function extender30(uid){let docRef=db.collection('config').doc(uid);let snap=await docRef.get();let data=snap.data()||{};let base=data.planVence?.toDate?data.planVence.toDate(): (data.planVence?new Date(data.planVence): new Date());if(base<Date.now())base=new Date();let nuevo=new Date(base.getTime()+30*86400000);await docRef.update({planVence:firebase.firestore.Timestamp.fromDate(nuevo),planActivo:true,bloqueado:false});loadAll();}
async function extender7(uid){let nuevo=new Date(Date.now()+7*86400000);await db.collection('config').doc(uid).update({trialFin:firebase.firestore.Timestamp.fromDate(nuevo),planActivo:true,bloqueado:false,trialInicio:firebase.firestore.Timestamp.now()});loadAll();}
async function toggleBloqueo(uid,actual){await db.collection('config').doc(uid).update({bloqueado:!actual,planActivo:actual});loadAll();}
async function resetUsos(uid){await db.collection('config').doc(uid).update({usosMes:0});loadAll();}
function renderClientes(panel){
let map={};cacheReservas.forEach(r=>{let key=r.email||r.clienteData?.email||r.clienteEmail;if(!key)return;if(!map[key])map[key]={email:key,wa:r.whatsapp||r.clienteData?.whatsapp||'',cant:0,uids:new Set()};map[key].cant++;if(r.uidLocal)map[key].uids.add(r.uidLocal);});
let lista=Object.values(map);if(lista.length===0){panel.innerHTML=`<div class="empty">Sin clientes - no hay reservas</div>`;return}
let html='<div class="grid">';lista.forEach(c=>{html+=`<div class="card"><div class="card-title">${c.email}</div><div class="card-sub">WA: ${c.wa} | Reservas: ${c.cant}</div><div class="card-sub">Locales: ${Array.from(c.uids).join(',')}</div><div class="btn-row"><button class="btn btn-del" onclick="bloquearUsuario('${c.email}')">Bloquear usuario</button></div></div>`});html+='</div>';panel.innerHTML=html;
}
async function bloquearUsuario(email){let uid=prompt('UID del local donde bloquear a '+email+' (pegar UID):');if(!uid)return;let ref=db.collection('config').doc(uid);let snap=await ref.get();let data=snap.data()||{};let arr=data.clientesBloqueados||[];if(!arr.includes(email))arr.push(email);await ref.update({clientesBloqueados:arr});alert('Bloqueado en '+uid)}
</script>
<script>
function renderPagos(panel){
let html='<div class="grid">';
cacheLocales.forEach(l=>{
if(l.id==='mensajes'||l.id==='planes'||l.id==='promo')return;
let comp=l.comprobanteBase64||l.comprobante||'';
let planComp=l.planCompBase64||'';
html+=`<div class="card"><div class="card-title">Pagos ${l.localNombre||l.id}</div><div class="card-sub">Alias: ${l.cobAlias||''} CBU: ${l.cobCBU||''} Titular: ${l.cobTitular||''}</div>${comp?`<img class="img-thumb" src="${comp}">`:''}${planComp?`<img class="img-thumb" src="${planComp}">`:''}<div class="btn-row"><button class="btn btn-ok" onclick="marcarPago('${l.id}')">Marcar pagado + extender</button></div></div>`;
});
html+='</div>';panel.innerHTML=html||'<div class="empty">Sin pagos</div>';
}
async function marcarPago(uid){await db.collection('config').doc(uid).update({comprobanteBase64:firebase.firestore.FieldValue.delete(),planCompBase64:firebase.firestore.FieldValue.delete()});await extender30(uid)}
function renderPlanes(panel){
let p=cachePlanes||{};
panel.innerHTML=`
<div class="card"><div class="card-title">Planes - Precio REAL tachado vs PROMO</div>
<div class="card-sub">Se ve en LANDING: $5000 tachado + $2500 PROMO</div>
<label class="card-sub">Basico REAL</label><input id="pl_bR" class="input" value="${p.basicoReal||5000}">
<label class="card-sub">Basico PROMO</label><input id="pl_bP" class="input" value="${p.basicoPromo||2500}">
<label class="card-sub">Medio REAL</label><input id="pl_mR" class="input" value="${p.medioReal||9000}">
<label class="card-sub">Medio PROMO</label><input id="pl_mP" class="input" value="${p.medioPromo||4500}">
<label class="card-sub">Premium REAL</label><input id="pl_prR" class="input" value="${p.premiumReal||15000}">
<label class="card-sub">Premium PROMO</label><input id="pl_prP" class="input" value="${p.premiumPromo||7500}">
<label class="card-sub">Cupos PROMO Basico (14)</label><input id="pl_cB" class="input" value="${p.cuposBasico||14}">
<label class="card-sub">Restantes Basico</label><input id="pl_rB" class="input" value="${p.restBasico||14}">
<label class="card-sub">Cupos Medio (10)</label><input id="pl_cM" class="input" value="${p.cuposMedio||10}">
<label class="card-sub">Restantes Medio</label><input id="pl_rM" class="input" value="${p.restMedio||10}">
<label class="card-sub">Cupos Premium (6)</label><input id="pl_cP" class="input" value="${p.cuposPremium||6}">
<label class="card-sub">Restantes Premium</label><input id="pl_rP" class="input" value="${p.restPremium||6}">
<div class="btn-row"><button class="btn btn-ok" onclick="guardarPlanes()">Guardar planes</button></div>
</div>`;
}
async function guardarPlanes(){
let data={
basicoReal:parseInt(document.getElementById('pl_bR').value)||5000,
basicoPromo:parseInt(document.getElementById('pl_bP').value)||2500,
medioReal:parseInt(document.getElementById('pl_mR').value)||9000,
medioPromo:parseInt(document.getElementById('pl_mP').value)||4500,
premiumReal:parseInt(document.getElementById('pl_prR').value)||15000,
premiumPromo:parseInt(document.getElementById('pl_prP').value)||7500,
cuposBasico:parseInt(document.getElementById('pl_cB').value)||14,
restBasico:parseInt(document.getElementById('pl_rB').value)||14,
cuposMedio:parseInt(document.getElementById('pl_cM').value)||10,
restMedio:parseInt(document.getElementById('pl_rM').value)||10,
cuposPremium:parseInt(document.getElementById('pl_cP').value)||6,
restPremium:parseInt(document.getElementById('pl_rP').value)||6,
ts:firebase.firestore.FieldValue.serverTimestamp()
};
await db.collection('config').doc('planes').set(data,{merge:true});
alert('Planes guardados');loadAll();
}
</script>
<script>
function renderMensajes(panel){
let m=cacheMensajes||{};
panel.innerHTML=`
<div class="card"><div class="card-title">Saludos editables - Modificás lo que le figura al LOCAL y CLIENTE</div>
<div class="card-sub">Saludo que ve el LOCAL en su panel</div>
<input id="msg_local" class="input" value="${m.saludoLocal||'Hola'}">
<div class="card-sub">Subtitulo LOCAL</div>
<input id="msg_localSub" class="input" value="${m.subLocal||'Tu panel de reservas'}">
<div class="card-sub">Saludo que ve el CLIENTE</div>
<input id="msg_cli" class="input" value="${m.saludoCliente||'Bienvenido a reservAR'}">
<div class="card-sub">Subtitulo CLIENTE</div>
<input id="msg_cliSub" class="input" value="${m.subCliente||'tu lugar, tu momento'}">
<div class="card-sub">Mensaje bloqueo</div>
<input id="msg_bloq" class="input" value="${m.msgBloqueo||'Bloqueado por admin'}">
<div class="card-sub">Mensaje gracia 48hs</div>
<input id="msg_gracia" class="input" value="${m.msgGracia||'Tu plan venció, te quedan 48hs para pagar'}">
<div class="btn-row"><button class="btn btn-ok" onclick="guardarMensajes()">Guardar saludos</button></div>
</div>
<div class="card"><div class="card-title">Cómo funciona entrelazado</div><div class="card-sub">LOCAL lee config/mensajes.saludoLocal en #saludo</div><div class="card-sub">CLIENTE lee config/mensajes.saludoCliente en header</div><div class="card-sub">Si no existe usa Hola nombre</div></div>
`;
}
async function guardarMensajes(){
let data={
saludoLocal:document.getElementById('msg_local').value,
subLocal:document.getElementById('msg_localSub').value,
saludoCliente:document.getElementById('msg_cli').value,
subCliente:document.getElementById('msg_cliSub').value,
msgBloqueo:document.getElementById('msg_bloq').value,
msgGracia:document.getElementById('msg_gracia').value,
ts:firebase.firestore.FieldValue.serverTimestamp()
};
await db.collection('config').doc('mensajes').set(data,{merge:true});
alert('Mensajes guardados');loadAll();
}
async function delSoporteReal(id){if(!confirm('Borrar soporte '+id+'?'))return;await db.collection('soporte').doc(id).delete();loadAll();}
async function delReservaReal(id){if(!confirm('Borrar reserva '+id+'?'))return;await db.collection('reservas').doc(id).delete();loadAll();}
function verDatosReal(i){
let r=cacheSoporte[i];
let txt=JSON.stringify(r,null,2);
let w=window.open('','_blank','width=600,height=800');
w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;padding:12px;background:#0f0a1e;color:#fff">'+txt+'</pre>');
}
</script>
<script>
function checkBloqueoTotal(cfg){
if(!cfg)return {bloq:true,msg:'sin config'};
if(cfg.bloqueado)return {bloq:true,msg:cfg.motivo||'Bloqueado por admin'};
if(cfg.visible===false)return {bloq:true,msg:'Local desconectado'};
if(cfg.planActivo===false)return {bloq:true,msg:'Plan vencido'};
if(cfg.reservasPausadas)return {bloq:true,msg:'Pausado'};
let trialFin=cfg.trialFin?.toDate?cfg.trialFin.toDate(): (cfg.trialFin?new Date(cfg.trialFin):null);
if(trialFin){let limite=new Date(trialFin.getTime()+48*3600000);if(Date.now()>limite.getTime()&&cfg.planActivo===false)return {bloq:true,msg:'Bloqueado 48hs gracia vencida'};}
return {bloq:false,msg:'ok'};
}
async function incUsosCasa(uidLocal){
try{
let ref=db.collection('config').doc(uidLocal);
let snap=await ref.get();let d=snap.data()||{};
if(d.plan==='casa'){await ref.update({usosMes:firebase.firestore.FieldValue.increment(1)});}
}catch(e){}
}
function esClienteBloqueado(cfg,email){
if(!cfg||!cfg.clientesBloqueados)return false;
return cfg.clientesBloqueados.includes(email);
}
function getSaludoLocalFallback(nombre,configMensajes){
if(configMensajes&&configMensajes.saludoLocal)return configMensajes.saludoLocal;
return `Hola, ${nombre||''}`;
}
function getSaludoClienteFallback(configMensajes){
if(configMensajes&&configMensajes.saludoCliente)return configMensajes.saludoCliente;
return 'Bienvenido a reservAR';
}

<script>
function calcPromoRestantes(){
let p=cachePlanes||{};
return {basico:p.restBasico||p.cuposBasico||14,medio:p.restMedio||10,premium:p.restPremium||6,total: (p.restBasico||14)+(p.restMedio||10)+(p.restPremium||6)};
}
function renderAvisosLocal(l){
let avisos='';
let trialFin=l.trialFin?.toDate?l.trialFin.toDate(): (l.trialFin?new Date(l.trialFin):null);
if(trialFin){
let dias=diasRestantes(trialFin);
if(dias>0&&dias<=7){avisos+=`<div class="aviso aviso-green">Trial: quedan ${dias} días</div>`}
else if(dias<=0){
let horas=horasGracia(trialFin);
if(horas!=='0hs'){avisos+=`<div class="aviso aviso-yellow">Gracia: ${horas} restantes</div>`}
else{avisos+=`<div class="aviso aviso-red">Bloqueado: gracia vencida</div>`}
}
}
return avisos;
}
