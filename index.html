<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar ADM</title>
<style>
body{font-family:Arial;background:#0f1115;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1a1d24;padding:24px;border-radius:12px;width:90%;max-width:360px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#2a2d36;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{opacity:.9}
.hidden{display:none!important}
#msg{margin-top:10px;font-size:13px;color:#ff8a8a;min-height:18px}
#ok{color:#8aff8a}
</style>
</head>
<body>
<div class="card">
<h2>ADM Login</h2>
<div id="loginBox">
<input id="email" type="email" placeholder="Email" value="jjrv.0093@gmail.com">
<input id="pass" type="password" placeholder="Contraseña">
<button id="loginBtn">Entrar</button>
<div id="msg"></div>
</div>
<div id="panelBox" class="hidden">
<div id="ok">Logueado como <span id="userEmail"></span></div>
<button id="logoutBtn">Salir</button>
<h3 style="margin-top:20px">Panel funcionando ✅</h3>
<p>Si ves esto, ya entraste. Ahora armamos el resto.</p>
</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
