label{font-size:12px;color:#d9ccff;margin-bottom:6px;display:block}

<script>
const firebaseConfig={apiKey:"AIzaSyC57wshaJ2EuIBoBdXv18opL4u_Vuw2bAQ",authDomain:"reservar-cb70d.firebaseapp.com",projectId:"reservar-cb70d",storageBucket:"reservar-cb70d.firebasestorage.app",messagingSenderId:"630908928696",appId:"1:630908928696:web:5e89f5f2b1cc2b240e6a4d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000);};
$('loginBtn').onclick=async()=>{const e=$('email').value.trim();const p=$('password').value.trim();$('err').textContent='Conectando...';try{await auth.signInWithEmailAndPassword(e,p);$('err').textContent='';}catch(er){$('err').textContent=er.message;}};
$('logout').onclick=()=>auth.signOut();
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(t.dataset.s).classList.add('active');if(t.dataset.s==='planes')renderLocalesFiltrados();if(t.dataset.s==='pagos')loadPagos();if(t.dataset.s==='soporte')loadSoporte('todos');if(t.dataset.s==='users')loadUsers();if(t.dataset.s==='cobros')loadCobros();if(t.dataset.s==='pausas')loadPausas();if(t.dataset.s==='logs')loadLogs();};});
let all=[];let cfg={horasPlan:48};let selectedUid=null;let filtroKpiActual='todos';let filtroPagos='pendiente';
function getVenceDate(l){if(!l)return null;const pv=l.planVence||l;if(!pv)return null;try{if(pv.toDate)return pv.toDate();if(pv.seconds)return new Date(pv.seconds*1000);const d=new Date(pv);return isNaN(d.getTime())?null:d;}catch(e){return null;}}
function estaActivo(l){if(!l)return false;if(l.bloqueado===true)return false;if(l.planActivo===false)return false;if(l.visible===false)return false;const v=getVenceDate(l);if(!v)return true;return (new Date()-v)/36e5<=(cfg.horasPlan||48);}
function fmtVence(l){const d=getVenceDate(l);if(!d)return '-';return d.toLocaleDateString('es-AR');}
function esc(t){if(!t)return '';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tsToDate(t){if(!t)return 0;if(t.toDate)return t.toDate().getTime();if(t.seconds)return t.seconds*1000;const d=new Date(t);return isNaN(d.getTime())?0:d.getTime();}
function fmtFecha(ts){const ms=tsToDate(ts);if(!ms)return '-';const d=new Date(ms);return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function grupoFecha(ts){const ms=tsToDate(ts);if(!ms)return 'SIN FECHA';const d=new Date(ms);const hoy=new Date();hoy.setHours(0,0,0,0);const ayer=new Date(hoy);ayer.setDate(hoy.getDate()-1);const fd=new Date(d);fd.setHours(0,0,0,0);if(fd.getTime()===hoy.getTime())return 'HOY';if(fd.getTime()===ayer.getTime())return 'AYER';const diff=(hoy-fd)/86400000;if(diff<7)return 'ESTA SEMANA';return 'ANTERIOR';}
function deptoNorm(s){if(!s)return '';return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function fotoConCache(url){if(!url)return '';return url+(url.includes('?')?'&':'?')+'v='+Date.now();}
function genWebUID(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function getPrecioReal(plan){const p=deptoNorm(plan);if(p.includes('basic')||p.includes('basi'))return 5000;if(p.includes('medio'))return 7000;if(p.includes('premium')||p.includes('premi'))return 10000;if(p.includes('casa'))return 2500;return 5000;}
</script>
<script>
auth.onAuthStateChanged(async u=>{
if(!u){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return;}
if(u.email==='jjrv.0093@gmail.com'){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('sal').textContent='Hola '+u.email+' OWNER';try{const c=await db.collection('config').doc('adm').get();if(c.exists){cfg=c.data();$('horasPlan').value=cfg.horasPlan||48;}const pt=await db.collection('config').doc('planes').get();if(pt.exists){const d=pt.data();$('pBaseNombre').value=d.base?.nombre||'Básico';$('pBaseLim').value=d.base?.limite||100;$('pBasePrecio').value=d.base?.precio||5000;$('pMedioNombre').value=d.medio?.nombre||'Medio';$('pMedioLim').value=d.medio?.limite||300;$('pMedioPrecio').value=d.medio?.precio||9000;$('pPremNombre').value=d.premium?.nombre||'Premium';$('pPremLim').value=d.premium?.limite||999999;$('pPremPrecio').value=d.premium?.precio||15000;}const cob=await db.collection('config').doc('cobros').get();if(cob.exists){const cc=cob.data();$('jonaAlias').value=cc.alias||'';$('jonaCbu').value=cc.cbu||'';$('jonaTitular').value=cc.titular||'';$('jonaWsp').value=cc.whatsapp||cc.wsp||'';$('jonaInstr').value=cc.instrucciones||'';}}catch(e){toast(e.message);}load();loadPagos();return;}
try{const udoc=await db.collection('users').doc(u.uid).get();if(!udoc.exists||udoc.data().rol!=='superadmin'){toast('No autorizado - falta rol superadmin');await auth.signOut();return;}}catch(e){toast(e.message);await auth.signOut();return;}
$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('sal').textContent='Hola '+u.email;load();loadPagos();
});
async function load(){try{const s=await db.collection('config').get();all=s.docs.filter(d=>!['cobros','planes','adm','branding','promos','gastos'].includes(d.id)).map(d=>({id:d.id,...d.data()}));const activos=all.filter(estaActivo).length;const vencidos=all.length-activos;let stackV=0;try{const admSnap=await db.collection('config').doc('adm').get();if(admSnap.exists){stackV=admSnap.data().stack||0;}}catch(e){}$('kpis').innerHTML=`<span class="pill click" onclick="filtrarKpi('todos')" style="background:#ffffff22">Total ${all.length}</span><span class="pill click" onclick="filtrarKpi('activos')" style="background:#22c55e33">Activos ${activos}</span><span class="pill click" onclick="filtrarKpi('vencidos')" style="background:#ef444433">Vencidos ${vencidos}</span>`;$('resumen').innerHTML=`<span class="pill">Gracia ${cfg.horasPlan||48}hs</span><span class="pill" style="background:#22c55e22">Stack ${stackV}/50</span>`;renderLocalesFiltrados();}catch(e){toast(e.message);}}
window.filtrarKpi=tipo=>{filtroKpiActual=tipo;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('[data-s="planes"]').classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('planes').classList.add('active');renderLocalesFiltrados();};
function renderLocalesFiltrados(){let lista=[...all];if(filtroKpiActual==='activos')lista=all.filter(estaActivo);if(filtroKpiActual==='vencidos')lista=all.filter(l=>!estaActivo(l));const g=$('grid');if(!g)return;g.innerHTML='';if(!lista.length){g.innerHTML=`<div class="card">Sin locales</div>`;return;}lista.forEach(l=>{const vence=fmtVence(l);const a=estaActivo(l);const promo=l.promoGratis?`<span class="pill" style="background:#facc1533;color:#000">${esc(l.promoMotivo||'PROMO')} ${esc(l.promoHasta||vence)}</span>`:'';
const trialBadge=l.trialUsado===false||l.trialUsado===undefined?`<span class="pill" style="background:#22c55e33">Trial 7d</span>`:l.trialUsado?`<span class="pill" style="background:#a855f733">Trial usado</span>`:`<span class="pill" style="background:#22c55e33">Trial</span>`;
const logo=l.logoUrl?`<img src="${esc(fotoConCache(l.logoUrl))}" style="width:40px;height:40px;border-radius:12px;object-fit:cover">`:'';const d=document.createElement('div');d.className='card';d.innerHTML=`<div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px;align-items:center">${logo}<b>${esc(l.nombre||l.localNombre||'Local')}</b></div><span class="pill" style="background:${a?'#22c55e33':'#ef444433'}">${a?'ACTIVO':'VENCIDO'}${l.bloqueado?' BLOQ':''}</span></div><div style="font-size:12px;color:#cfc9e6;margin:8px 0">${esc(l.email||'')} - ${esc(l.plan||'')} ${promo} ${trialBadge}</div><div style="font-size:12px;margin-bottom:8px">Vence: ${esc(vence)}</div><div style="display:flex;flex-wrap:wrap;gap:6px"><button class="btn small" onclick="activar48('${l.id}')">48hs</button><button class="btn small ghost" onclick="darPromo('${l.id}',7)">+7</button><button class="btn small ghost" onclick="darPromo('${l.id}',15)">+15</button><button class="btn small ghost" onclick="darPromo('${l.id}',30)">+30</button><button class="btn small ghost" style="background:#fff;color:#000;font-weight:900" onclick="darCustom('${l.id}')">+N</button><button class="btn small ghost" onclick="verFicha('${l.id}')">Ver</button></div>`;g.appendChild(d);});}
window.setFiltroPagos=t=>{filtroPagos=t;$('btnPagPend').className=t==='pendiente'?'btn small':'btn small ghost';$('btnPagPend').style.background=t==='pendiente'?'#facc15':'';$('btnPagPend').style.color=t==='pendiente'?'#000':'';$('btnPagAprob').className=t==='aprobado'?'btn small':'btn small ghost';$('btnPagAprob').style.background=t==='aprobado'?'#22c55e':'';$('btnPagRech').className=t==='rechazado'?'btn small':'btn small ghost';$('btnPagRech').style.background=t==='rechazado'?'#ef4444':'';loadPagos();};
</script>
<script>
async function loadPagos(){
const ul=$('pagosList');const kpi=$('pagosKpi');ul.innerHTML='<li class="item">Cargando...</li>';if(kpi)kpi.innerHTML='';try{const snap=await db.collection('solicitudes').where('estado','==',filtroPagos).limit(100).get();if(snap.empty){ul.innerHTML=`<li class="item">No hay ${esc(filtroPagos)}</li>`;return;}let docs=snap.docs.map(d=>({id:d.id,...d.data()}));docs.sort((a,b)=>tsToDate(b.ts)-tsToDate(a.ts));if(filtroPagos==='aprobado'){const hoy=new Date();hoy.setHours(0,0,0,0);docs=docs.filter(d=>tsToDate(d.aprobado_en||d.aprobadoEn||d.ts)>=hoy.getTime());}if(kpi){const grupos={};docs.forEach(d=>{const g=grupoFecha(d.ts);grupos[g]=(grupos[g]||0)+1;});kpi.innerHTML=Object.keys(grupos).map(g=>`<span class="pill">${g} ${grupos[g]}</span>`).join('')+`<span class="pill" style="background:#ffffff22">Total ${docs.length}</span>`;}ul.innerHTML='';let ultimoGrupo='';for(const x of docs){const g=grupoFecha(x.ts);if(g!==ultimoGrupo){ultimoGrupo=g;const sep=document.createElement('li');sep.className='item';sep.style.background='#ffffff22';sep.style.justifyContent='center';sep.innerHTML=`<b>${g}</b>`;ul.appendChild(sep);}const comp=x.comprobante||'';const li=document.createElement('li');li.className='item';li.style.flexDirection='column';li.style.alignItems='flex-start';li.innerHTML=`<div style="width:100%"><b>${esc(x.nombreLocal||x.localNombre||'Local')}</b> <span class="pill" style="background:#facc15;color:#000">${esc(x.plan||'')}</span><div style="font-size:12px">${esc(x.email||'')} - ${esc(fmtFecha(x.ts))} - $${x.precioReal||x.monto||''}</div></div>${comp?`<img src="${comp}" style="width:100%;max-width:380px;border-radius:14px;margin-top:8px">`:''}<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${filtroPagos==='pendiente'?'<button class="btn small" style="background:#22c55e">Aprobar 30d REAL</button><button class="btn small ghost" style="background:#fff;color:#000">Aprobar 7d Trial</button><button class="btn small ghost">Rechazar</button>':''}</div>`;if(filtroPagos==='pendiente'){const btns=li.querySelectorAll('button');btns[0].onclick=()=>aprobarPagoTransaccion(x.id,30,btns[0]);btns[1].onclick=()=>aprobarPagoTransaccion(x.id,7,btns[1]);btns[2].onclick=()=>rechazarPago(x.id,x.uid,btns[2]);}ul.appendChild(li);}}catch(e){$('pagosList').innerHTML=`<li class="item">Error: ${esc(e.message)}</li>`;}}
async function aprobarPagoTransaccion(solicId,diasExtra,btn){
if(btn){btn.textContent='Aprobando...';btn.disabled=true;}
try{
await db.runTransaction(async (tx)=>{
const solRef=db.collection('solicitudes').doc(solicId);
const solSnap=await tx.get(solRef);
if(!solSnap.exists)throw new Error('Solicitud no existe');
const sol=solSnap.data();
if(sol.estado!=='pendiente')throw new Error('Ya procesada');
const uid=sol.uid;
const cfgRef=db.collection('config').doc(uid);
const cfgSnap=await tx.get(cfgRef);
if(!cfgSnap.exists)throw new Error('Local no existe');
const localData=cfgSnap.data();
const promoRef=db.collection('config').doc('promos');
const promoSnap=await tx.get(promoRef);
let promos=promoSnap.exists?promoSnap.data():{promo14:{cupoTotal:14,cupoUsado:0},promo10:{cupoTotal:10,cupoUsado:0},promo6:{cupoTotal:6,cupoUsado:0},promoCasa:{cupoTotal:100,cupoUsado:0}};
let promoKey=null;
if(diasExtra===7)promoKey='promo14';
else if(diasExtra===30)promoKey='promo10';
if(promoKey&&promos[promoKey]){if(promos[promoKey].cupoUsado>=promos[promoKey].cupoTotal)throw new Error('SIN CUPO '+promoKey);}
let venceVieja=getVenceDate(localData);
let baseDate=new Date();
if(venceVieja&&venceVieja>baseDate)baseDate=new Date(venceVieja);
let venceNueva=new Date(baseDate);
venceNueva.setDate(venceNueva.getDate()+diasExtra);
const precio=getPrecioReal(sol.plan||localData.plan);
tx.set(cfgRef,{plan:sol.plan||localData.plan||'Medio',planActivo:true,visible:true,bloqueado:false,estado:'activo',planVence:firebase.firestore.Timestamp.fromDate(venceNueva),plan_estado:'aprobado',trialUsado:true,promoGratis:diasExtra!==30?true:false,promoMotivo:diasExtra===7?'Trial 7 días':diasExtra===30?'Aprobado 30d':'Custom',promoHasta:venceNueva.toLocaleDateString('es-AR')},{merge:true});
if(promoKey&&promos[promoKey]){promos[promoKey].cupoUsado=(promos[promoKey].cupoUsado||0)+1;tx.set(promoRef,promos,{merge:true});}
tx.update(solRef,{estado:'aprobado',precioReal:precio,monto:precio,diasDados:diasExtra,aprobado_en:firebase.firestore.FieldValue.serverTimestamp(),aprobadoEn:firebase.firestore.FieldValue.serverTimestamp()});
const logRef=db.collection('config').doc('logs').collection('lista').doc();
tx.set(logRef,{tipo:'aprobacion',solicId,uid,plan:sol.plan,dias:diasExtra,precio,timestamp:firebase.firestore.FieldValue.serverTimestamp(),fecha:fmtFecha(new Date())});
});
toast('Aprobado '+diasExtra+'d REAL');
await loadPagos();await load();await loadCobros();
}catch(e){toast('Error: '+e.message);if(btn){btn.textContent='Error';btn.disabled=false;setTimeout(()=>{btn.textContent=diasExtra===7?'Aprobar 7d Trial':'Aprobar 30d REAL';btn.disabled=false;},2000);}return;}
}
async function rechazarPago(solicId,uid,btn){

if(!confirm('Rechazar?')){if(btn){btn.textContent='Rechazar';btn.disabled=false;}return;}
await db.collection('config').doc(uid).set({planActivo:false,visible:false,plan_estado:'rechazado',estado:'rechazado'},{merge:true});

toast('Rechazado');loadPagos();load();
}

async function crearReservaSegura(localId,celu,fechaISO,servicioId){
const localRef=db.collection('config').doc(localId);
const localSnap=await localRef.get();
if(!localSnap.exists)throw new Error('Local no existe');
const localData=localSnap.data();
if(!estaActivo(localData))throw new Error('Local pausado por falta de pago');
if(localData.bloqueado===true)throw new Error('Local bloqueado REAL');
const hoy=new Date();hoy.setHours(0,0,0,0);
const f=new Date(fechaISO);f.setHours(0,0,0,0);
if(f<hoy)throw new Error('Fecha pasada');
const fechaSolo=fechaISO.split('T')[0];
const pausaRef=db.collection('config').doc(localId).collection('pausasFechas').doc(fechaSolo);
const pausaSnap=await pausaRef.get();
if(pausaSnap.exists)throw new Error('Local pausado ese dia');
if(servicioId){const servs=localData.servicios||[];if(!servs.find(s=>s.id===servicioId||s.nombre===servicioId))throw new Error('Servicio no existe');}
const q=await db.collection('reservas').where('localId','==',localId).where('celu','==',celu).where('estado','in',['activa','pendiente']).get();
if(q.size>=2)throw new Error('Limite 2 reservas');
const ref=db.collection('reservas').doc();
await ref.set({localId,celu,fecha:fechaISO,fechaSolo,servicioId:servicioId||null,estado:'activa',ts:firebase.firestore.FieldValue.serverTimestamp()});
return ref.id;
}
async function enviarSoporteSeguro(payload){
const celu=payload.celu||payload.telefono||'';
const uid=payload.uid||payload.localId||'';
if(celu){const u=await db.collection('users').doc(celu).get();if(u.exists&&u.data().bloqueado===true)throw new Error('Usuario bloqueado REAL');}
if(uid){const c=await db.collection('config').doc(uid).get();if(c.exists&&c.data().bloqueado===true)throw new Error('Local bloqueado REAL');}
const ref=db.collection('soporte').doc();
await ref.set({...payload,leido:false,ts:firebase.firestore.FieldValue.serverTimestamp(),hora:fmtFecha(new Date())});
return ref.id;
}
async function bloquearReal(celu,uid){
const batch=db.batch();
if(uid){batch.set(db.collection('config').doc(uid),{bloqueado:true,planActivo:false,visible:false,estado:'bloqueado'},{merge:true});}
if(celu){batch.set(db.collection('users').doc(celu),{bloqueado:true,estado:'bloqueado'},{merge:true});}
if(!celu&&uid){batch.set(db.collection('users').doc(uid),{bloqueado:true,estado:'bloqueado'},{merge:true});}
await batch.commit();
const logRef=db.collection('config').doc('logs').collection('lista').doc();
await logRef.set({tipo:'bloqueo',uid,celu,timestamp:firebase.firestore.FieldValue.serverTimestamp(),fecha:fmtFecha(new Date())});
}
async function desbloquearReal(celu,uid){
const batch=db.batch();
if(uid){batch.set(db.collection('config').doc(uid),{bloqueado:false,planActivo:true,visible:true,estado:'activo'},{merge:true});}
if(celu){batch.set(db.collection('users').doc(celu),{bloqueado:false,estado:'activo'},{merge:true});}
if(!celu&&uid){batch.set(db.collection('users').doc(uid),{bloqueado:false,estado:'activo'},{merge:true});}
await batch.commit();
const logRef=db.collection('config').doc('logs').collection('lista').doc();
await logRef.set({tipo:'desbloqueo',uid,celu,timestamp:firebase.firestore.FieldValue.serverTimestamp(),fecha:fmtFecha(new Date())});
}

$('btnGuardarTarifas').onclick=async()=>{try{const base={nombre:$('pBaseNombre').value.trim()||'Básico',limite:Number($('pBaseLim').value)||0,precio:Number($('pBasePrecio').value)||0};const medio={nombre:$('pMedioNombre').value.trim()||'Medio',limite:Number($('pMedioLim').value)||0,precio:Number($('pMedioPrecio').value)||0};const premium={nombre:$('pPremNombre').value.trim()||'Premium',limite:Number($('pPremLim').value)||0,precio:Number($('pPremPrecio').value)||0};$('tarifaMsg').textContent='Guardando...';await db.collection('config').doc('planes').set({base,medio,premium,updated:firebase.firestore.FieldValue.serverTimestamp()});$('tarifaMsg').textContent='Guardado';toast('Guardado');}catch(e){$('tarifaMsg').textContent='Error: '+e.message;}};
$('btnGuardarCobrosJona').onclick=async()=>{try{await db.collection('config').doc('cobros').set({alias:$('jonaAlias').value,cbu:$('jonaCbu').value,titular:$('jonaTitular').value,whatsapp:$('jonaWsp').value,instrucciones:$('jonaInstr').value},{merge:true});$('msgCobrosJona').textContent='Guardado';toast('Guardado');}catch(e){toast(e.message);}};
$('btnGuardarHoras').onclick=async()=>{try{await db.collection('config').doc('adm').set({horasPlan:Number($('horasPlan').value||48)},{merge:true});cfg.horasPlan=Number($('horasPlan').value||48);$('ajMsg').textContent='Guardado';toast('Guardado');load();}catch(e){toast(e.message);}};
$('btnAddGasto').onclick=async()=>{const concepto=$('gastoConcepto').value.trim();const monto=Number($('gastoMonto').value);if(!concepto||!monto){toast('Concepto y monto');return;}await db.collection('config').doc('gastos').collection('lista').doc().set({concepto,monto,ts:firebase.firestore.FieldValue.serverTimestamp()});$('gastoConcepto').value='';$('gastoMonto').value='';loadCobros();};
</script>
</body>
</html>
