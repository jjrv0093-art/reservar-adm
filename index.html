function getVenceDate(l){
if(!l)return null;
const pv=l.planVence||l;
if(!pv)return null;
try{
if(pv.toDate)return pv.toDate();
if(pv.seconds)return new Date(pv.seconds*1000);
const d=new Date(pv);
return isNaN(d.getTime())?null:d;
}catch(e){
return null;
}
}
function estaActivo(l){
if(!l)return false;
if(l.bloqueado===true)return false;
if(l.planActivo===false)return false;
if(l.visible===false)return false;
const v=getVenceDate(l);
if(!v)return true;
return (new Date()-v)/36e5<=(cfg.horasPlan||48);
}
function fmtVence(l){
const d=getVenceDate(l);
if(!d)return '-';
return d.toLocaleDateString('es-AR');
}
function esc(t){
if(!t)return '';
return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function tsToDate(t){
if(!t)return 0;
if(t.toDate)return t.toDate().getTime();
if(t.seconds)return t.seconds*1000;
const d=new Date(t);
return isNaN(d.getTime())?0:d.getTime();
}
function fmtFecha(ts){
const ms=tsToDate(ts);
if(!ms)return '-';
const d=new Date(ms);
return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}
function grupoFecha(ts){
const ms=tsToDate(ts);
if(!ms)return 'SIN FECHA';
const d=new Date(ms);
const hoy=new Date();
hoy.setHours(0,0,0,0);
const ayer=new Date(hoy);
ayer.setDate(hoy.getDate()-1);
const fd=new Date(d);
fd.setHours(0,0,0,0);
if(fd.getTime()===hoy.getTime())return 'HOY';
if(fd.getTime()===ayer.getTime())return 'AYER';
const diff=(hoy-fd)/86400000;
if(diff<7)return 'ESTA SEMANA';
return 'ANTERIOR';
}

<script>
async function loadPagos(){
const ul=$('pagosList');
const kpi=$('pagosKpi');
ul.innerHTML='<li class="item">Cargando...</li>';
if(kpi)kpi.innerHTML='';
try{
const snap=await db.collection('solicitudes').where('estado','==',filtroPagos).limit(100).get();
if(snap.empty){
ul.innerHTML=`<li class="item">No hay ${esc(filtroPagos)}</li>`;
return;
}
let docs=snap.docs.map(d=>({id:d.id,...d.data()}));
docs.sort((a,b)=>tsToDate(b.ts)-tsToDate(a.ts));
if(filtroPagos==='aprobado'){
const hoy=new Date();
hoy.setHours(0,0,0,0);
docs=docs.filter(d=>tsToDate(d.aprobado_en||d.ts)>=hoy.getTime());
}
if(kpi){
const grupos={};
docs.forEach(d=>{
const g=grupoFecha(d.ts);
grupos[g]=(grupos[g]||0)+1;
});
kpi.innerHTML=Object.keys(grupos).map(g=>`<span class="pill">${g} ${grupos[g]}</span>`).join('')+`<span class="pill" style="background:#ffffff22">Total ${docs.length}</span>`;
}
ul.innerHTML='';
let ultimoGrupo='';
for(const x of docs){
const g=grupoFecha(x.ts);
if(g!==ultimoGrupo){
ultimoGrupo=g;
const sep=document.createElement('li');
sep.className='item';
sep.style.background='#ffffff22';
sep.style.justifyContent='center';
sep.innerHTML=`<b>${g}</b>`;
ul.appendChild(sep);
}
let cfgExtra=all.find(a=>a.id===x.uid)||{};
const comp=x.comprobante||'';
const li=document.createElement('li');
li.className='item';
li.style.flexDirection='column';
li.style.alignItems='flex-start';
li.innerHTML=`<div style="width:100%"><b>${esc(x.nombreLocal||'Local')}</b> <span class="pill" style="background:#facc15;color:#000">${esc(x.plan||'')}</span><div style="font-size:12px">${esc(x.email||'')} - ${esc(fmtFecha(x.ts))}</div></div>${comp?`<img src="${comp}" style="width:100%;max-width:380px;border-radius:14px;margin-top:8px">`:''}<div style="display:flex;gap:6px;margin-top:10px">${filtroPagos==='pendiente'?'<button class="btn small" style="background:#22c55e">Aprobar</button><button class="btn small ghost">Rechazar</button>':''}</div>`;
if(filtroPagos==='pendiente'){
const btns=li.querySelectorAll('button');
btns[0].onclick=()=>aprobarPago(x.id,x.uid,x.plan,btns[0]);
btns[1].onclick=()=>rechazarPago(x.id,x.uid,btns[1]);
}
ul.appendChild(li);
}
}catch(e){
$('pagosList').innerHTML=`<li class="item">Error: ${esc(e.message)}</li>`;
}
}
async function aprobarPago(solicId,uid,plan,btn){
if(btn){btn.textContent='Aprobando...';btn.disabled=true;}
if(!confirm('Aprobar 30 dias?')){if(btn){btn.textContent='Aprobar';btn.disabled=false;}return;}
const vence=new Date();
vence.setDate(vence.getDate()+30);
await db.collection('config').doc(uid).set({plan:plan||'Medio',planActivo:true,visible:true,bloqueado:false,planVence:firebase.firestore.Timestamp.fromDate(vence),plan_estado:'aprobado',trialUsado:true},{merge:true});
await db.collection('solicitudes').doc(solicId).update({estado:'aprobado',aprobado_en:firebase.firestore.FieldValue.serverTimestamp()});
toast('Aprobado');
loadPagos();
load();
}
async function rechazarPago(solicId,uid,btn){
if(btn){btn.textContent='Rechazando...';btn.disabled=true;}
if(!confirm('Rechazar?')){if(btn){btn.textContent='Rechazar';btn.disabled=false;}return;}
await db.collection('config').doc(uid).set({planActivo:false,visible:false,plan_estado:'rechazado'},{merge:true});
await db.collection('solicitudes').doc(solicId).update({estado:'rechazado',rechazado_en:firebase.firestore.FieldValue.serverTimestamp()});
toast('Rechazado');
loadPagos();
load();
}
window.activar48=async id=>{
const base=getVenceDate(all.find(a=>a.id===id));
let vence=base&&base>new Date()?new Date(base):new Date();
vence.setHours(vence.getHours()+48);
await db.collection('config').doc(id).set({planVence:firebase.firestore.Timestamp.fromDate(vence),planActivo:true,visible:true,bloqueado:false},{merge:true});
toast('48hs');
load();
};
window.darPromo=async(id,dias)=>{
const motivo=prompt(`Dar ${dias} dias`,dias==30?'Gentileza':'Promo');
if(motivo===null)return;
let hasta=new Date();
hasta.setDate(hasta.getDate()+dias);
await db.collection('config').doc(id).set({planVence:firebase.firestore.Timestamp.fromDate(hasta),planActivo:true,visible:true,bloqueado:false,promoGratis:true,promoHasta:hasta.toLocaleDateString('es-AR'),promoMotivo:motivo,trialUsado:true},{merge:true});
toast(`${dias}d`);
load();
};
window.darCustom=async id=>{
const inp=prompt('Cuantos dias?');
if(inp===null)return;
const dias=Number(inp);
if(isNaN(dias)||dias<=0){toast('Numero invalido');return;}
let hasta=new Date();
hasta.setDate(hasta.getDate()+dias);
await db.collection('config').doc(id).set({planVence:firebase.firestore.Timestamp.fromDate(hasta),planActivo:true,visible:true,bloqueado:false,promoGratis:true,promoHasta:hasta.toLocaleDateString('es-AR'),promoMotivo:'Custom',trialUsado:true},{merge:true});
toast(`${dias}d`);
load();
};
</script>
<script>
window.verFicha=async id=>{
try{
const doc=await db.collection('config').doc(id).get();
if(!doc.exists){toast('No existe');return;}
const d=doc.data();
selectedUid=id;
$('modalTitle').textContent=d.localNombre||'Ficha';
$('modalBody').innerHTML=`<div>Nombre: ${esc(d.localNombre||'-')}</div><div>Email: ${esc(d.email||'-')}</div><div>Plan: ${esc(d.plan||'-')}</div><div>Vence: ${esc(fmtVence(d))}</div><div>Bloqueado: ${d.bloqueado?'SI':'NO'}</div><div>UID: ${esc(id)}</div>`;
let pausasHtml='';
try{
const pSnap=await db.collection('config').doc(id).collection('pausasFechas').get();
pausasHtml=pSnap.empty?'Sin pausas':pSnap.docs.map(p=>esc(p.id)).join(', ');
}catch(e){pausasHtml='Sin pausas';}
$('modalPausas').innerHTML=`<div style="background:#00000044;border-radius:8px;padding:8px;font-size:11px">${pausasHtml}</div>`;
$('userModal').classList.remove('hidden');
}catch(e){toast(e.message);}
};
$('modalClose').onclick=()=>{$('userModal').classList.add('hidden');};
$('modalBloq').onclick=async()=>{
if(!selectedUid)return;
if(!confirm('Bloquear?'))return;
await db.collection('config').doc(selectedUid).set({bloqueado:true,planActivo:false,visible:false},{merge:true});
toast('Bloqueado');
$('userModal').classList.add('hidden');
load();
};
$('modalDesPausas').onclick=async()=>{
if(!selectedUid)return;
if(!confirm('Quitar pausas?'))return;
const snap=await db.collection('config').doc(selectedUid).collection('pausasFechas').get();
for(const doc of snap.docs){await doc.ref.delete();}
toast('Pausas quitadas');
$('userModal').classList.add('hidden');
};
async function loadSoporte(tipo){
const ul=$('sList');
ul.innerHTML='<li class="item">Cargando...</li>';
try{
const snap=await db.collection('soporte').limit(150).get();
let docs=snap.docs.map(d=>({id:d.id,...d.data()}));
docs.sort((a,b)=>tsToDate(b.ts)-tsToDate(a.ts));
if(tipo==='local')docs=docs.filter(d=>d.origen==='local');
if(tipo==='cliente')docs=docs.filter(d=>d.origen==='cliente');
ul.innerHTML='';
docs.forEach(x=>{
const esLocal=x.origen==='local';
const li=document.createElement('li');
li.className='item';
li.style.flexDirection='column';
li.style.alignItems='flex-start';
li.style.border=esLocal?'1px solid #a855f7':'1px solid #22c55e';
li.innerHTML=`<div style="width:100%;display:flex;justify-content:space-between"><b style="color:${esLocal?'#a855f7':'#22c55e'}">${esLocal?'LOCAL':'CLIENTE'}</b><span class="pill">${esc(x.tipo||'')}</span></div><div style="font-size:12px;margin:6px 0">${esc(x.mensaje||'')}</div><div style="font-size:11px;color:#cfc9e6">Local: ${esc(x.nombreLocal||'')} - Cliente: ${esc(x.nombreCliente||'')}</div>${x.imagen?`<img src="${x.imagen}" style="max-width:200px;border-radius:10px;margin-top:6px">`:''}<div style="margin-top:8px"><button class="btn small ghost">Borrar</button></div>`;
li.querySelector('button').onclick=()=>borrarSoporte(x.id);
ul.appendChild(li);
});
if(!docs.length)ul.innerHTML='<li class="item">Sin soporte</li>';
}catch(e){$('sList').innerHTML=`<li class="item">Error: ${esc(e.message)}</li>`;}
}
window.borrarSoporte=async id=>{
if(!confirm('Borrar?'))return;
await db.collection('soporte').doc(id).delete();
toast('Borrado');
loadSoporte('todos');
};
async function loadUsers(){
const ul=$('uList');
ul.innerHTML='<li class="item">Cargando...</li>';
try{
const snap=await db.collection('users').limit(200).get();
ul.innerHTML='';
snap.forEach(d=>{
const x=d.data();
const li=document.createElement('li');
li.className='item';
li.innerHTML=`<div><b>${esc(x.email||d.id)}</b><div style="font-size:11px">${esc(x.rol||'')} - ${esc(d.id)}</div></div><div style="display:flex;gap:6px"><button class="btn small ghost">Ver</button><button class="btn small ghost">Bloquear</button></div>`;
const b=li.querySelectorAll('button');
b[0].onclick=()=>verFicha(d.id);
b[1].onclick=()=>bloquearUser(d.id);
ul.appendChild(li);
});
}catch(e){$('uList').innerHTML=`<li class="item">Error: ${esc(e.message)}</li>`;}
}
window.bloquearUser=async id=>{
if(!confirm('Bloquear?'))return;
await db.collection('config').doc(id).set({bloqueado:true,planActivo:false,visible:false},{merge:true});
toast('Bloqueado');
loadUsers();
load();
};
$('reload').onclick=load;
$('reloadUsers').onclick=loadUsers;
</script>
