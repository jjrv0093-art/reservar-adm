<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>reservAR ADMI</title><style>:root{--stroke:#ffffff26}*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#fff;background:linear-gradient(160deg,#6a11cb,#7b1fa2 40%,#3a0f6e 70%,#0a0933);background-attachment:fixed}.hidden{display:none!important}.wrap{max-width:1100px;margin:0 auto;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(31,7,54,.98);border-bottom:1px solid var(--stroke)}.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}.tab{border:1px solid var(--stroke);background:#ffffff12;color:#fff;padding:12px 20px;border-radius:999px;cursor:pointer;font-weight:700;white-space:nowrap}.tab.active{background:#fff;color:#3a0f6e}.btn{background:#a855f7;border:none;color:#fff;padding:.6rem .9rem;border-radius:10px;cursor:pointer;font-weight:700}.btn.ghost{background:transparent;border:1px solid var(--stroke)}.btn.full{width:100%}.btn.small{padding:.35rem .6rem;font-size:12px}.auth{max-width:420px;margin:30px auto;background:#ffffff12;border:1px solid var(--stroke);border-radius:14px;padding:16px}.auth input{width:100%;padding:.7rem;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:#fff;margin-bottom:8px}.screen{display:none}.screen.active{display:block}.card{background:#ffffff12;border:1px solid var(--stroke);border-radius:16px;padding:16px;margin-bottom:12px}.list{list-style:none;margin:0;padding:0}.item{display:flex;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--stroke);border-radius:12px;background:#ffffff0f;margin-bottom:8px}.pill{padding:6px 10px;border-radius:999px;border:1px solid var(--stroke);background:#ffffff18;font-size:12px}#grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-weight:800;z-index:99}#err{color:#fca5a5;min-height:18px}</style><script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'></script></head><body>
<div style="padding:12px 20px"><b>reservAR ADMI</b></div>
<section id="auth" class="auth"><h2>Ingresá ADMI</h2><input id="email" value="jjrv.0093@gmail.com"><input id="password" type="password" placeholder="Contraseña"><p id="err"></p><button id="loginBtn" class="btn full">Entrar</button></section>
<section id="app" class="hidden"><div class="topbar"><div><b>reservAR ADMI</b></div><button id="logout" class="btn small ghost">Salir</button></div><div class="wrap"><div class="tabs"><button class="tab active" data-s="dash">Inicio</button><button class="tab" data-s="planes">Planes</button><button class="tab" data-s="users">Usuarios</button></div>
<div id="dash" class="screen active"><div class="card"><h2 id="sal">Panel</h2><div id="kpis" class="row"></div></div></div>
<div id="planes" class="screen"><div class="card"><div class="row"><input id="bus" placeholder="Buscar..." style="max-width:300px"><button id="reload" class="btn small ghost">Recargar</button></div><div id="grid"></div></div></div>
<div id="users" class="screen"><div class="card"><ul id="uList" class="list"></ul></div></div>
</div></section><div id="toast" class="toast hidden"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyC4vXWnSW2dX-rjm1Lc93LEh09oE6ftdgc",authDomain:"reservar-adm.firebaseapp.com",projectId:"reservar-adm",storageBucket:"reservar-adm.firebasestorage.app",messagingSenderId:"557571104394",appId:"1:557571104394:web:18c596d6190b2d013fd773"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)};
window.onerror=(msg)=>{ $('err').textContent=msg; toast(msg); };
$('loginBtn').onclick=async()=>{
  const e=$('email').value.trim(); const p=$('password').value.trim();
  $('err').textContent='Conectando...';
  try{ await auth.signInWithEmailAndPassword(e,p); $('err').textContent=''; }
  catch(er){ $('err').textContent=er.code+' '+er.message; toast(er.message); }
};
$('logout').onclick=()=>auth.signOut();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(t.dataset.s).classList.add('active'); });
let all=[];
auth.onAuthStateChanged(async u=>{
  if(!u){ $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  if(u.email.toLowerCase()!=='jjrv.0093@gmail.com'){ toast('No sos ADMI'); await auth.signOut(); return; }
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden'); $('sal').textContent='Hola ADMI '+u.email;
  load();
});
async function load(){
  try{
    const s=await db.collection('locales').get();
    all=s.docs.map(d=>({id:d.id,...d.data()}));
    $('kpis').innerHTML=`<span class="pill">Total ${all.length}</span>`;
    const g=$('grid'); g.innerHTML='';
    all.forEach(l=>{
      const d=document.createElement('div'); d.className='card';
      d.innerHTML=`<b>${l.nombre||'Local'}</b><div style="font-size:12px">${l.email||''}</div><div class="row" style="margin-top:8px"><button class="btn small" onclick="act('${l.id}')">Activar 48hs</button></div>`;
      g.appendChild(d);
    });
    const us=await db.collection('usuarios').limit(100).get();
    $('uList').innerHTML=us.docs.map(x=>`<li class="item">${x.data().email||x.id}</li>`).join('');
  }catch(e){ toast(e.message); }
}
window.act=async id=>{ await db.collection('locales').doc(id).update({planVence:firebase.firestore.FieldValue.serverTimestamp(),planActivo:true}); toast('Activado'); load(); };
$('bus').oninput=e=>{ const q=e.target.value.toLowerCase(); const f=all.filter(l=>(l.nombre||'').toLowerCase().includes(q)); const g=$('grid'); g.innerHTML=''; f.forEach(l=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<b>${l.nombre||'Local'}</b><div class="row" style="margin-top:8px"><button class="btn small" onclick="act('${l.id}')">Activar 48hs</button></div>`; g.appendChild(d); }); };
$('reload').onclick=load;
</script></body></html>
