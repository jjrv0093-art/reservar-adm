<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM Jalolito 10 TABS 0 FALLAS</title>
<style>
:root{--vio:#6d28d9;--vio2:#8b5cf6;--bg:#0f0a1e;--card:#1e1b2e;--ok:#22c55e;--red:#ef4444;--yel:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#fff}
header{padding:14px 18px;background:linear-gradient(90deg,var(--vio),var(--vio2));font-weight:800;display:flex;justify-content:space-between}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:10px;background:#151225;position:sticky;top:0;z-index:9}
.tab{padding:8px 14px;border-radius:20px;background:var(--card);cursor:pointer;white-space:nowrap;border:1px solid #2a2550}
.tab.act{background:var(--vio);color:#fff}
.panel{display:none;padding:14px}.panel.act{display:block}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;border:1px solid #2a2550}
.btn{padding:8px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
  .btn-v{background:var(--vio);color:#fff}.btn-r{background:var(--red);color:#fff}.btn-g{background:var(--ok);color:#000}.btn-y{background:var(--yel);color:#000}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px}
.red{color:var(--red)}.green{color:var(--ok)}
input,select{padding:8px;border-radius:8px;border:1px solid #333;background:#0f0a1e;color:#fff;width:100%;margin:4px 0}
img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<header><span>ADM reservar-cb70d - 10 TABS 0 FALLAS</span><span id="kpi"></span></header>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where, Timestamp, runTransaction, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC...",authDomain:"reservar-cb70d.firebaseapp.com",projectId:"reservar-cb70d"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const fmtFecha=d=>new Date(d).toLocaleDateString('es-AR');
const tsToDate=ts=>ts?.toDate?ts.toDate():new Date(ts);
function deptoNorm(s){return s.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function getVenceDate(data){return data.planVence?.toDate?data.planVence.toDate():(data.planVence?new Date(data.planVence):new Date(0));}
function estaActivo(data,horasGracia=48){
const vence=getVenceDate(data);
const limite=new Date(vence.getTime()+horasGracia*3600*1000);
return new Date()<limite&&data.planActivo!==false&&data.bloqueado!==true;
}
function genWebUID(){return 'luz-'+Math.random().toString(36).substring(2,6);}
async function crearReservaSegura(localId,servicioId,fechaHoraStr,celu,nombre){
const localRef=doc(db,'config',localId);
const localSnap=await getDoc(localRef);
if(!localSnap.exists()) throw new Error('Local no existe');
const localData=localSnap.data();
if(!estaActivo(localData,48)){
throw new Error('Local pausado por falta de pago - Jjrv093.uala');
}
if(localData.bloqueado===true) throw new Error('Local bloqueado REAL');
const fechaRes=new Date(fechaHoraStr);
const hoy0=new Date();hoy0.setHours(0,0,0,0);
if(fechaRes<hoy0) throw new Error('No se puede reservar fecha pasada');
const fechaSolo=fechaHoraStr.split('T')[0];
const pausaRef=doc(db,'config',localId,'pausasFechas',fechaSolo);
const pausaSnap=await getDoc(pausaRef);
if(pausaSnap.exists()) throw new Error('Local pausado ese dia '+fechaSolo);
const servicios=localData.servicios||[];
const serv=servicios.find(s=>s.id===servicioId);
if(!serv) throw new Error('Servicio ya no existe');
const q=query(collection(db,'reservas'),where('localId','==',localId),where('celu','==',celu),where('estado','==','activa'));
const resSnap=await getDocs(q);
if(resSnap.size>=2) throw new Error('Limite 2 reservas');
const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
await setDoc(doc(db,'reservas',id),{
id,localId,servicioId,servicioNombre:serv.nombre,
fechaHora:fechaHoraStr,
celu,nombre,estado:'activa',
ts:serverTimestamp(),
fecha:fmtFecha(new Date())
});
return id;
}
async function enviarSoporteSeguro(celu,uid,texto,origen='local'){
if(celu){
const uSnap=await getDoc(doc(db,'users',celu));
if(uSnap.exists()&&uSnap.data().bloqueado===true) throw new Error('Usuario bloqueado REAL');
}
if(uid){
const cSnap=await getDoc(doc(db,'config',uid));
if(cSnap.exists()&&cSnap.data().bloqueado===true) throw new Error('Local bloqueado REAL');
}
const id=Date.now().toString(36);
await setDoc(doc(db,'soporte',id),{
id,celu,uid,texto,origen,
ts:serverTimestamp(),
fecha:new Date().toLocaleDateString('es-AR'),
hora:new Date().toLocaleTimeString('es-AR'),
leido:false
});
}
async function aprobarPagoTransaccion(solicitudId,diasExtra){
const solRef=doc(db,'solicitudes',solicitudId);
await runTransaction(db,async(tx)=>{
const solSnap=await tx.get(solRef);
if(!solSnap.exists()) throw new Error('Solicitud no existe');
const sol=solSnap.data();
if(sol.estado!=='pendiente') throw new Error('Ya procesada');
const localId=sol.uid;
const configRef=doc(db,'config',localId);
const configSnap=await tx.get(configRef);
if(!configSnap.exists()) throw new Error('Config no existe');
const cfg=configSnap.data();
const plan=sol.plan||'basico';
const promoMap={basico:'promo14',medio:'promo10',premium:'promo6',casa:'promoCasa'};
const promoId=promoMap[plan]||'promo14';
const promoRef=doc(db,'config','promos');
const promoSnap=await tx.get(promoRef);
const promos=promoSnap.exists()?promoSnap.data():{};
const promo=promos[promoId]||{cupoTotal:14,cupoUsado:0};
if(promo.cupoUsado>=promo.cupoTotal) throw new Error('SIN CUPO '+promoId);
const venceVieja=getVenceDate(cfg);
const hoy=new Date();
const base=venceVieja>hoy?venceVieja:hoy;
const venceNueva=new Date(base.getTime()+diasExtra*24*3600*1000);
const precios={basico:5000,medio:7000,premium:10000,casa:2500};
const precioReal=precios[plan]||5000;
tx.update(configRef,{
planVence:Timestamp.fromDate(venceNueva),
planActivo:true,
visible:true,
estado:'activo',
bloqueado:false,
plan:plan
});
promos[promoId].cupoUsado=(promos[promoId].cupoUsado||0)+1;
tx.set(promoRef,promos,{merge:true});
tx.update(solRef,{
estado:'aprobado',
precioReal:precioReal,
diasDados:diasExtra,
aprobadoEn:serverTimestamp()
});
});
}
async function bloquearReal(celu,uid){
if(celu) await setDoc(doc(db,'users',celu),{bloqueado:true,estado:'bloqueado'},{merge:true});
if(uid) await setDoc(doc(db,'config',uid),{bloqueado:true,visible:false,planActivo:false,estado:'bloqueado'},{merge:true});
}
async function desbloquearReal(celu,uid){
if(celu) await setDoc(doc(db,'users',celu),{bloqueado:false,estado:'activo'},{merge:true});
if(uid) await setDoc(doc(db,'config',uid),{bloqueado:false,visible:true,planActivo:true,estado:'activo'},{merge:true});
}
async function desbloquearDesdeSoporte(celu,uid){
await desbloquearReal(celu,uid);
}
function fotoConCache(url){
if(!url) return '';
return url+(url.includes('?')?'&':'?')+'v='+Date.now();
}
const TABS=[
{id:'resumen',name:'1 RESUMEN'},
{id:'pagos',name:'2 PAGOS'},
{id:'planes',name:'3 PLANES'},
{id:'tarifas',name:'4 TARIFAS'},
{id:'soporte',name:'5 SOPORTE'},
{id:'users',name:'6 USERS'},
{id:'cobros',name:'7 COBROS'},
{id:'config',name:'8 CONFIG'},
{id:'pausas',name:'9 PAUSAS'},
{id:'logs',name:'10 LOGS'}
];
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
TABS.forEach((t,i)=>{
const b=document.createElement('div');b.className='tab'+(i===0?' act':'');b.textContent=t.name;b.onclick=()=>activarTab(t.id);tabsEl.appendChild(b);
const p=document.createElement('div');p.className='panel'+(i===0?' act':'');p.id='panel-'+t.id;p.innerHTML='<div class="card">Cargando '+t.name+'...</div>';panelsEl.appendChild(p);
});
function activarTab(id){
document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('act',TABS[i].id===id));
document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('act',el.id==='panel-'+id));
}
async function loadResumen(){
const allSnap=await getDocs(collection(db,'config'));
let all=[];
allSnap.forEach(d=>{if(!['promos','gastos','tarifas'].includes(d.id)) all.push({id:d.id,...d.data()});});
const allSinEliminados=all.filter(l=>l.estado!=='eliminado');
const activos=allSinEliminados.filter(l=>estaActivo(l,48));
const vencidos=allSinEliminados.filter(l=>!estaActivo(l,48));
document.getElementById('kpi').textContent='Total:'+allSinEliminados.length+' Act:'+activos.length+' Venc:'+vencidos.length;
document.getElementById('panel-resumen').innerHTML='<div class="card">ADM 0 FALLAS - STACK 27/50 - TRANSACTION - BLOQUEO REAL</div>';
}
async function loadPagos(){
const snap=await getDocs(query(collection(db,'solicitudes'),where('estado','==','pendiente')));
let html='<div class="card"><b>TAB 2 PAGOS</b></div>';
snap.forEach(d=>{
const s=d.data();
html+='<div class="card">Plan:'+s.plan+' Celu:'+s.celu+' UID:'+s.uid.slice(0,6)+' Monto:'+s.monto+'<br><button class="btn btn-g" onclick="window.aprobar(\''+d.id+'\',7)">+7</button> <button class="btn btn-v" onclick="window.aprobar(\''+d.id+'\',30)">+30</button> <button class="btn btn-r" onclick="window.rechazar(\''+d.id+'\')">Rechazar</button></div>';
});
document.getElementById('panel-pagos').innerHTML=html||'<div class="card">Sin pendientes</div>';
}
window.aprobar=async(id,dias)=>{try{await aprobarPagoTransaccion(id,dias);alert('Aprobado +'+dias);loadPagos();loadResumen();}catch(e){alert(e.message);}};
window.rechazar=async(id)=>{await updateDoc(doc(db,'solicitudes',id),{estado:'rechazado'});loadPagos();};
async function loadPlanes(){
const promosSnap=await getDoc(doc(db,'config','promos'));
const promos=promosSnap.exists()?promosSnap.data():{};
let html='<div class="card"><b>TAB 3 PLANES</b><br>';
Object.entries(promos).forEach(([k,v])=>{html+=k+': '+v.cupoUsado+'/'+v.cupoTotal+'<br>';});
html+='</div><div class="card"><input id="uidBlock" placeholder="uid"><input id="celuBlock" placeholder="celu"><br><button class="btn btn-r" onclick="bloquearReal(document.getElementById(\'celuBlock\').value,document.getElementById(\'uidBlock\').value)">Bloquear REAL</button> <button class="btn btn-g" onclick="desbloquearReal(document.getElementById(\'celuBlock\').value,document.getElementById(\'uidBlock\').value)">Desbloquear REAL</button></div>';
document.getElementById('panel-planes').innerHTML=html;
}
async function loadCobros(){
const solSnap=await getDocs(collection(db,'solicitudes'));
let totalReal=0,detalle={};
solSnap.forEach(d=>{
const s=d.data();
if(s.estado==='aprobado'){
const monto=Number(s.precioReal||s.monto||5000);
totalReal+=monto;
detalle[s.plan||'basico']=(detalle[s.plan||'basico']||0)+monto;
}
});
const gastosSnap=await getDocs(collection(db,'config','gastos','lista'));
let gastos=0;gastosSnap.forEach(d=>{gastos+=Number(d.data().monto||0);});
const totalNeto=totalReal-gastos;
document.getElementById('panel-cobros').innerHTML='<div class="card"><b>TAB 7 COBROS</b><br>Entradas: $'+totalReal+'<br>'+Object.entries(detalle).map(([k,v])=>k+':$'+v).join(' | ')+'<br>Gastos: $'+gastos+'<br><b>TOTAL: $'+totalNeto+'</b></div>';
}
async function loadSoporte(){
const snap=await getDocs(collection(db,'soporte'));
let arr=[];snap.forEach(d=>arr.push(d.data()));
arr.sort((a,b)=>(b.leido===false?1:0)-(a.leido===false?1:0)||(b.ts?.seconds||0)-(a.ts?.seconds||0));
let html='<div class="card"><b>TAB 5 SOPORTE</b></div>';
arr.slice(0,50).forEach(s=>{
html+='<div class="card">'+(s.leido?'':'<span class="pill" style="background:var(--red)">NO LEIDO</span>')+' '+(s.fecha||'')+' '+(s.hora||'')+' '+(s.origen||'')+' '+(s.celu||'')+'<br>'+(s.texto||'')+'<br><button class="btn btn-g" onclick="desbloquearDesdeSoporte(\''+(s.celu||'')+'\',\''+(s.uid||'')+'\')">Desbloquear REAL</button> <button class="btn btn-r" onclick="bloquearReal(\''+(s.celu||'')+'\',\''+(s.uid||'')+'\')">Bloquear REAL</button></div>';
});
document.getElementById('panel-soporte').innerHTML=html;
}
async function loadUsers(){
const snap=await getDocs(collection(db,'users'));
let html='<div class="card"><b>TAB 6 USERS</b></div>';
snap.forEach(d=>{const u=d.data();html+='<div class="card">'+d.id+' '+(u.bloqueado?'<span class=red>BLOQUEADO</span>':'<span class=green>ACTIVO</span>')+'<br><button class="btn btn-r" onclick="bloquearReal(\''+d.id+'\',\'\')">Bloquear</button> <button class="btn btn-g" onclick="desbloquearReal(\''+d.id+'\',\'\')">Desbloquear</button></div>';});
document.getElementById('panel-users').innerHTML=html;
}
document.getElementById('panel-tarifas').innerHTML='<div class="card">TAB 4 TARIFAS</div>';
document.getElementById('panel-config').innerHTML='<div class="card">TAB 8 CONFIG</div>';
document.getElementById('panel-pausas').innerHTML='<div class="card">TAB 9 PAUSAS</div>';
document.getElementById('panel-logs').innerHTML='<div class="card">TAB 10 LOGS - 0 FALLAS</div>';
loadResumen();loadPagos();loadPlanes();loadCobros();loadSoporte();loadUsers();
window.bloquearReal=bloquearReal;window.desbloquearReal=desbloquearReal;window.desbloquearDesdeSoporte=desbloquearDesdeSoporte;
window.crearReservaSegura=crearReservaSegura;window.enviarSoporteSeguro=enviarSoporteSeguro;
</script>
</body>
</html>
